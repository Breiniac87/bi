name: Build Windows Portable Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-portable:
    name: Build Windows Portable Package
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up MSVC C++ Compiler Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Generate Multi-Resolution Windows Icon (.ico)
        run: |
          python scripts/convert_icon.py

      - name: Compile Python ETL to Executable
        run: |
          pyinstaller --noconfirm sync_local_to_sqlite.spec

      - name: Build Next.js Standalone Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Compile Native Windows Launcher (.exe)
        shell: cmd
        run: |
          rc.exe /fo windows\app_icon.res windows\app_icon.rc
          cl.exe /utf-8 /O2 /W3 /DUNICODE /D_UNICODE windows\launcher.c windows\app_icon.res /Fe:"windows\launcher.exe" user32.lib shell32.lib wininet.lib shlwapi.lib /link /SUBSYSTEM:WINDOWS

      - name: Extract Application Version
        shell: pwsh
        run: |
          $ver = (Get-Content frontend/package.json | ConvertFrom-Json).version
          Write-Host "Application Version: $ver"
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assemble Windows Portable Bundle
        shell: pwsh
        run: |
          $stage = "dist_windows\E-Commerce-Dashboard-Portable"
          $release = "release_windows"
          New-Item -ItemType Directory -Force -Path "$stage\app", "$stage\etl", "$stage\data\ads", "$stage\data\sales", $release | Out-Null

          # 1. Чистые шаблоны БД и конфигурации + инициализация в data/
          python -c "import sync_local_to_sqlite; sync_local_to_sqlite.init_db(r'$stage\template.db')"
          Copy-Item "$stage\template.db" "$stage\data\dashboard.db"
          @{ ads_dir = ""; sales_dir = "" } | ConvertTo-Json | Set-Content "$stage\template_config.json" -Encoding UTF8
          Copy-Item "$stage\template_config.json" "$stage\data\config.json"

          # 2. Упаковка скомпилированного ETL
          Copy-Item -Recurse -Force "dist\sync_local_to_sqlite" "$stage\etl\sync_local_to_sqlite"

          # 3. Упаковка Next.js Standalone сервера и статических ассетов (CSS/JS)
          node scripts/assemble_app.js "$stage\app"

          # 4. Упаковка автономного node.exe в корень портативной папки
          $nodePath = (Get-Command node.exe).Source
          Copy-Item $nodePath "$stage\node.exe"

          # Включаем DLL-библиотеки Visual C++ Redistributable для корректной работы better-sqlite3.node
          Copy-Item "C:\Windows\System32\vcruntime140*.dll" "$stage\app\" -ErrorAction SilentlyContinue
          Copy-Item "C:\Windows\System32\msvcp140*.dll" "$stage\app\" -ErrorAction SilentlyContinue
          Copy-Item "C:\Windows\System32\vcruntime140*.dll" "$stage\" -ErrorAction SilentlyContinue
          Copy-Item "C:\Windows\System32\msvcp140*.dll" "$stage\" -ErrorAction SilentlyContinue

          # 5. Исполняемый файл лаунчера и иконка
          Copy-Item "windows\launcher.exe" "$stage\E-Commerce Dashboard.exe"
          Copy-Item "windows\app_icon.ico" "$stage\app_icon.ico"

          Write-Host "✓ Портативная папка $stage успешно сформирована."

      - name: Compile Inno Setup Installer
        shell: cmd
        run: |
          iscc /DAPP_VERSION="%APP_VERSION%" windows\setup.iss
          echo ✓ Готовый инсталлятор: release_windows\E-Commerce-Dashboard-Setup-v%APP_VERSION%.exe

      - name: Upload Installer as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Commerce-Dashboard-Setup-v${{ env.APP_VERSION }}
          path: release_windows/E-Commerce-Dashboard-Setup-v*.exe
          retention-days: 14

      - name: Publish to GitHub Releases (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_windows/E-Commerce-Dashboard-Setup-v*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
