name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Setup.exe
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up MSVC C++ Compiler Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Generate Multi-Resolution Windows Icon (.ico)
        run: |
          python scripts/convert_icon.py

      - name: Compile Python ETL to Executable
        run: |
          pyinstaller --noconfirm sync_local_to_sqlite.spec

      - name: Build Next.js Standalone Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Compile Native Windows Launcher (.exe)
        shell: cmd
        run: |
          rc.exe /fo windows\app_icon.res windows\app_icon.rc
          cl.exe /O2 /W3 /DUNICODE /D_UNICODE windows\launcher.c windows\app_icon.res /Fe:windows\launcher.exe user32.lib shell32.lib wininet.lib shlwapi.lib /link /SUBSYSTEM:WINDOWS

      - name: Assemble Windows Standalone Bundle
        shell: pwsh
        run: |
          $stage = "dist_windows"
          $release = "release_windows"
          New-Item -ItemType Directory -Force -Path "$stage\app", "$stage\etl", $release | Out-Null

          # 1. Чистые шаблоны БД и конфигурации
          python -c "import sync_local_to_sqlite; sync_local_to_sqlite.init_db(r'$stage\template.db')"
          @{ ads_dir = ""; sales_dir = "" } | ConvertTo-Json | Set-Content "$stage\template_config.json" -Encoding UTF8

          # 2. Упаковка скомпилированного ETL
          Copy-Item -Recurse -Force "dist\sync_local_to_sqlite" "$stage\etl\sync_local_to_sqlite"

          # 3. Упаковка Next.js Standalone сервера (включая скрытые папки .next)
          Get-ChildItem -Force "frontend\.next\standalone\*" | Copy-Item -Destination "$stage\app" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$stage\app\.next\static" | Out-Null
          Copy-Item -Recurse -Force "frontend\.next\static\*" "$stage\app\.next\static\"
          if (Test-Path "frontend\public") {
              Copy-Item -Recurse -Force "frontend\public" "$stage\app\public"
          }

          # 4. Упаковка автономного node.exe
          $nodePath = (Get-Command node.exe).Source
          Copy-Item $nodePath "$stage\node.exe"

          # 5. Скрипты запуска, нативный лаунчер и иконка
          Copy-Item "windows\launcher.exe" "$stage\launcher.exe"
          Copy-Item "windows\launch.bat" "$stage\launch.bat"
          Copy-Item "windows\launcher.vbs" "$stage\launcher.vbs"
          Copy-Item "windows\stop.bat" "$stage\stop.bat"
          Copy-Item "windows\app_icon.ico" "$stage\app_icon.ico"

          Write-Host "✓ Промежуточный бандл $stage успешно сформирован."

      - name: Extract Application Version
        shell: pwsh
        run: |
          $ver = (Get-Content frontend/package.json | ConvertFrom-Json).version
          Write-Host "Application Version: $ver"
          echo "APP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Compile Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ env.APP_VERSION }}" /DSourceDir="..\dist_windows" windows\installer.iss

      - name: Upload Setup.exe as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Commerce-Dashboard-Setup-v${{ env.APP_VERSION }}
          path: release_windows/E-Commerce-Dashboard-Setup-v*.exe
          retention-days: 14

      - name: Publish to GitHub Releases (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_windows/E-Commerce-Dashboard-Setup-v*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
